name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger on push to main branch
      - feature/structure-project  # test feature branch
  pull_request:
    branches:
      - main  # Trigger on PR to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # # Install Poetry
      # - name: Install Poetry
      #   run: pip install poetry==2.1.3

      # Install uv
      - name: Install uv
        run: pip install uv        

      # # Cache Poetry dependencies
      # - name: Cache Poetry dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/pypoetry
      #     key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-poetry-

      # Cache uv dependencies
      # uv's default cache directory is typically ~/.cache/uv on Linux
      # You might need to generate a uv.lock file locally and commit it for effective caching.
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-        

      # # Install dependencies
      # - name: Install dependencies
      #   run: poetry install --only main

      # Install dependencies using uv
      # uv sync installs dependencies based on pyproject.toml and uv.lock.
      # If you have dev dependencies in a group (e.g., [dependency-groups.dev]),
      # you can exclude them using --no-group dev.
      - name: Install dependencies
        # run: uv sync --no-group dev # Adjust 'dev' to your actual development dependency group name if different
        run: uv sync


      # Read version from version.txt
      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
        shell: bash

      # Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & push backend image
      - name: Build and push FastAPI backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastapi
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend:${{ steps.get_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend:latest

      # Build & push frontend image
      - name: Build and push Streamlit frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.streamlit
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend:${{ steps.get_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend:latest

      # # Build and push Docker image
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKERHUB_USERNAME }}/rag-demo:${{ steps.get_version.outputs.VERSION }}
      #       ${{ secrets.DOCKERHUB_USERNAME }}/rag-demo:${{ github.sha }}
      #     # Optionally tag with 'latest' for main branch
      #     additional-tags: |
      #       ${{ github.ref == 'refs/heads/main' && format('{0}/rag-demo:latest', secrets.DOCKERHUB_USERNAME) || '' }}


  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure staging slot exists
        run: |
          if ! az webapp deployment slot list \
            --resource-group ${{ secrets.AZURE_RG }} \
            --name ${{ secrets.AZURE_WEBAPP }} \
            --query "[?name=='staging']" -o tsv | grep staging; then
            az webapp deployment slot create \
              --name ${{ secrets.AZURE_WEBAPP }} \
              --resource-group ${{ secrets.AZURE_RG }} \
              --slot staging
          else
            echo "Staging slot already exists, skipping creation."
          fi

      - name: Get staging URL
        id: get_staging_url
        run: |
          STAGING_URL=$(az webapp show \
            --resource-group ${{ secrets.AZURE_RG }} \
            --name ${{ secrets.AZURE_WEBAPP }} \
            --slot staging \
            --query defaultHostName -o tsv)
          echo "STAGING_URL=$STAGING_URL" >> $GITHUB_ENV          

      - name: Update docker-compose with staging URL
          run: |
            sed -i "s|STAGING_API_URL|https://${STAGING_URL}/rag2|g" docker-compose.prod.yml


      - name: Deploy docker-compose to staging slot
        run: |
          az webapp config container set \
            --resource-group ${{ secrets.AZURE_RG }} \
            --name ${{ secrets.AZURE_WEBAPP }} \
            --slot staging \
            --multicontainer-config-type compose \
            --multicontainer-config-file docker-compose.prod.yml

  swap-to-production:
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --resource-group ${{ secrets.AZURE_RG }} \
            --name ${{ secrets.AZURE_WEBAPP }} \
            --slot staging \
            --target-slot production





