# Optional KG development service. Same Compose project/network as the application.
# Does not load the application's env_file or start ingestion/API services.
services:
  neo4j:
    profiles: [kg]
    image: neo4j:2026.09.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j-local-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data: {}
  neo4j_logs: {}
