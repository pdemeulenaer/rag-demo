site_name: RAG Demo
site_description: Documentation for the RAG demo — Streamlit + FastAPI + Qdrant retrieval-augmented generation stack
site_author: Philippe de Meulenaer
repo_url: https://github.com/pdemeulenaer/rag-demo

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - arXiv milestone: getting-started/arxiv.md
  - Architecture:
      - Overview: architecture/index.md
      - RAG Pipeline: architecture/rag-pipeline.md
      - Ingestion: architecture/ingestion.md
      - API Surface: architecture/api.md
  - Operations:
      - Overview: operations/index.md
      - Catalogue and consistency: operations/catalogue.md
      - Daily ingestion and Airflow: operations/daily-ingestion.md
      - Deployment: operations/deployment.md
      - Evaluation: operations/evaluation.md
      - Benchmarks: operations/benchmarks.md
  - Code Reference:
      - Overview: reference/index.md
      - API Routers: reference/api.md
      - RAG Core: reference/rag.md
      - Ingestion: reference/ingestion.md
      - Frontend: reference/frontend.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_toc: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list

validation:
  nav:
    omitted_files: ignore
