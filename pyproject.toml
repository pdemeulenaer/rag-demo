[project]
name = "rag-demo"
version = "0.2.0"
description = "A demo RAG for LangChain and Groq"
authors = [{ name = "pdemeulenaer", email = "pdemeulenaer@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "groq",
    "rag",
    "retrieval-augmented-generation",
    "streamlit",
    "fastapi",
    "langsmith",
    "openai",
    "cohere",
    "qdrant",
    "redis",
    "pymupdf",
]
dependencies = [
    "python-dotenv (>=1.0.1,<2.0.0)",
    "langchain (>=0.3.20,<0.4.0)",
    "langchain-community (>=0.3.19,<0.4.0)",
    "langchain-groq (>=0.2.4,<0.3.0)",
    "pymupdf (>=1.25.5,<2.0.0)",
    "qdrant-client>=1.18,<1.19",
    "httpx (>=0.28.1,<0.29.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "cohere >=5.12.0,<6.0.0",
    "uvicorn>=0.35.0",
    "fastapi>=0.116.1",
    "langsmith>=0.4.14",
    "openai>=1.95.1",
    "instructor>=1.10.0",
    "groq>=0.30.0",
    "redis>=6.4.0",
    "rapidfuzz>=3.14.0",
    "python-multipart>=0.0.20",
    "pillow>=11.3.0",
    "azure-storage-blob>=12.27.1",
    "tenacity>=9.1.2",
]

[dependency-groups]
frontend = [
    "streamlit (>=1.43.2,<2.0.0)",
    "requests>=2.32.0",
]
eval = [
    "ragas (>=0.2.15,<0.3.0)",
    "langchain-openai>=0.3.0,<0.4.0",
]
docling = [
    # Experimental PDF parser; pulls PyTorch and model-related dependencies.
    "docling>=2.71.0",
]
dev = [
    "ipykernel>=6.29.5",
    "mkdocs>=1.6.1", 
    # "mkdocs-pdf-export-plugin>=1.1.2", 
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.28.0", 
    "pymdown-extensions>=10.0",
    "griffe>=0.48.0",
    "mkdocs-print-site-plugin>=2.6.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocs-same-dir>=0.1.3",
]
