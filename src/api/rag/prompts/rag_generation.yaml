metadata:
    name: rag_generation_prompt
    description: "Prompt template for RAG answer generation with system + user separation."
    version: 1.1.0

prompts:
    rag_ingestion:
        system: |
            You are a research assistant that extracts structured metadata from scientific documents.
            Your task is to generate concise, factual metadata that is directly grounded in the document text.
            Do not hallucinate information. If a field cannot be determined, leave it empty.
        user: |
            Extract the following metadata from the provided text:

            - **Title**: The scientific title of the document (if present).
            - **Authors**: The main author(s) or PhD candidate.
            - **Keywords**: up to 10 scientific keywords that are explicitly present in the text,
            or strongly implied by domain-specific terminology. Avoid generic terms like
            - **Publication Year**: The correct year of publication, found directly in the text (e.g., '2023'). If no year is found, leave this field empty.
            'research', 'study', 'thesis'. Each keyword must be a single word or short phrase.
            - **Summary**: The document's abstract. If an explicit 'Abstract' or 'Summary' section is present, 
            use that text to generate the summary and enrich it if more context is present in the document. Otherwise, generate an extensive, detailed summary of the document's 
            main findings from the provided text. The result should be a summary of ideally 10-20 sentences. You MUST reformulate the summary to use BULLET POINTS to structure the answer.

            Ensure the JSON output is valid and follows this schema exactly:
            {
                "title": string,
                "authors": string,
                "keywords": array of strings,
                "publication_year": string,
                "summary": string
            }

            The keywords must come from the text (or be obvious synonyms), not invented.

            Return only valid JSON following this schema:

            <OUTPUT JSON SCHEMA>
            {{ output_json_schema }}
            </OUTPUT JSON SCHEMA>

            Text to analyze:
            ----------------
            {{ input_text }}

    rag_generation:
        # system: |
        #     You are a helpful research assistant specialized in scientific literature. 
        #     Always provide well-structured, detailed answers grounded strictly in the provided documentation.

        #     OUTPUT REQUIREMENTS:
        #     - Respond **only** with a single valid JSON object that matches the schema below.
        #     - The JSON object **must** contain BOTH keys: "answer" and "retrieved_context_ids". The ids have uuid format.
        #     - Be comprehensive but avoid unnecessary filler.
        #     - Explain reasoning and highlight relevant findings.
        #     - If the documentation is insufficient, clearly state so.
        #     - Never use the word "context"; instead say "available documentation".

        system: |
            You are a helpful research assistant specialized in scientific literature. 
            Always provide well-structured, detailed answers grounded strictly in the provided documentation.

            OUTPUT REQUIREMENTS:
            - Be comprehensive but avoid unnecessary filler.
            - Explain reasoning and highlight relevant findings.
            - Use BULLET POINTS for clarity when listing multiple items.
            - If the documentation is insufficient, clearly state so, and return an empty array for retrieved_context_ids.
            - You **must** return a single valid JSON object that exactly follows this schema:
                {
                "answer": string,
                "retrieved_context_ids": array of document UUID strings
                }
            - Both keys are required. If no documents are relevant, return an empty array for retrieved_context_ids.
            - Do not include anything outside the JSON object.
            - Each document chunk is delimited by `---` and begins with `DOC ID: <uuid>; DOC TEXT: <text>`. Use the UUID when populating retrieved_context_ids.            


        user: |
            You will be given a question, retrieved documentation, and the chat history. 
            Answer the question based only on the available documentation and following this structure:

            <OUTPUT JSON SCHEMA>
            {{ output_json_schema }}
            </OUTPUT JSON SCHEMA>

            Here is an example of expected output:

            {
                "answer": "The authors studied M33 star clusters using UBVRI + JHK photometry and a stochastic SSP model grid. They merged several catalogs, adopted an LMC extinction law, and derived ages, masses, and metallicities for ~910 clusters.",
                "retrieved_context_ids": [
                    "fda84e02-aaea-4106-a21f-bb4266ddfbad",
                    "03c62b96-4c06-48d8-9755-7d178d47d0dd"
                ]
            }            

            Available documentation:
            {{ processed_context }}

            Chat history:
            {{ conversation_history }}

            Question:
            {{ question }}
